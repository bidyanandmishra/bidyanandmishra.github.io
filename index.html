<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page-bg"></div>

<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<header class="topbar">

    <div class="brand">
        <span class="brand-heart">♥</span>
        <span>Happy Birthday</span>
    </div>

    <button class="music-btn" id="musicBtn">
        <span id="musicIcon">♫</span>
    </button>

</header>

<main class="main">

<section class="card">

    <div class="page-no">1 / 8</div>

    <div class="center">

        <div class="content">

            <span class="heart">♥</span>

            <h1 class="title">
                Happy Birthday
            </h1>

            <p class="subtitle">
                Today is all about you
                <span class="heart" style="display:inline;font-size:24px">
                    ♥
                </span>
            </p>

            <div class="envelope"
                 data-next="page2.html">
                <div class="env-back"></div>
                <div class="env-paper">
                    Tap to Open My Letter
                </div>
                <div class="env-flap"></div>
                <div class="env-front"></div>

            </div>

        </div>

    </div>

    <nav class="nav">

        <a href="#"
           style="opacity:.3;pointer-events:none">
            ← Back
        </a>

        <div class="dots">
            <i class="active"></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
        </div>

        <a href="page2.html">
            Next →
        </a>

    </nav>

</section>

</main>

<div class="balloons left">
    <span class="balloon purple"></span>
    <span class="balloon pink"></span>
</div>

<div class="balloons right">
    <span class="balloon blue"></span>
    <span class="balloon pink"></span>
</div>

<div class="bottom">
    <span class="balloon blue"></span>
    <span class="balloon yellow"></span>
    <span class="balloon pink"></span>
</div>

<audio id="music" loop>
    <source src="music/birthday.mp3" type="audio/mpeg">
</audio>

<script src="js/script.js"></script>

</body>
</html>
