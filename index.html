<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================================
   PAGE 1 SUBTITLE WORD ANIMATION
   Only affects the birthday message
========================================================= */

.subtitle {
    text-align: center;
    line-height: 1.6;
}

/* Each word */

.subtitle .animated-word {
    display: inline-block;

    opacity: 0;

    transform:
        translateY(15px)
        scale(0.96);

    filter: blur(5px);

    margin-right: 5px;

    animation:
        subtitleWordReveal
        0.55s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
}


/* Romantic words */

.subtitle .animated-word.highlight {
    color: #ff63b3;

    font-weight: 600;

    text-shadow:
        0 0 8px rgba(255, 70, 175, 0.8),
        0 0 18px rgba(255, 70, 175, 0.4);
}


/* Final heart */

.subtitle .animated-heart {
    display: inline-block;

    opacity: 0;

    transform: scale(0.5);

    color: #ff4f91;

    font-size: 24px;

    margin-left: 3px;

    text-shadow:
        0 0 8px #ff4f91,
        0 0 20px #ff4f91;

    animation:
        heartAppear
        0.6s
        ease-out
        forwards,
        heartPulse
        1.5s
        ease-in-out
        1s
        infinite;
}


/* Word entrance */

@keyframes subtitleWordReveal {

    0% {
        opacity: 0;

        transform:
            translateY(15px)
            scale(0.96);

        filter: blur(5px);
    }

    60% {
        opacity: 1;

        transform:
            translateY(-2px)
            scale(1.03);

        filter: blur(0);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }
}


/* Heart entrance */

@keyframes heartAppear {

    0% {
        opacity: 0;

        transform:
            scale(0.3);
    }

    70% {
        opacity: 1;

        transform:
            scale(1.3);
    }

    100% {
        opacity: 1;

        transform:
            scale(1);
    }
}


/* Heart pulse */

@keyframes heartPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }
}


/* Blinking cursor */

.subtitle .typing-cursor {
    display: inline-block;

    width: 2px;

    height: 22px;

    margin-left: 4px;

    vertical-align: middle;

    background: #ff63b3;

    box-shadow:
        0 0 8px #ff63b3;

    animation:
        cursorBlink
        0.8s
        infinite;
}

@keyframes cursorBlink {

    0%,
    45% {
        opacity: 1;
    }

    46%,
    100% {
        opacity: 0;
    }
}


/* Mobile */

@media (max-width: 600px) {

    .subtitle .animated-word {
        margin-right: 3px;
    }

}

</style>

</head>


<body>


<div class="page-bg"></div>


<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>


<header class="topbar">


    <div class="brand">

        <span class="brand-heart">♥</span>

        <span>
            Happy Birthday
        </span>

    </div>


    <button
        class="music-btn"
        id="musicBtn">

        <span id="musicIcon">
            ♫
        </span>

    </button>


</header>


<main class="main">

<section class="card">
    <div class="center">
        <div class="content">
            <span class="heart">
                ♥
            </span>
            <h1 class="title">
                Happy Birthday ❤️
            </h1>

            <!-- =================================================
                 ANIMATED BIRTHDAY MESSAGE
            ================================================== -->

            <p
                class="subtitle"
                id="birthdaySubtitle">
            </p>


            <!-- =================================================
                 ENVELOPE
            ================================================== -->

            <div
                class="envelope"
                data-next="page2.html">

                <div class="env-back"></div>

                <div class="env-paper">

                    Tap to Open My Letter

                </div>

                <div class="env-flap"></div>

                <div class="env-front"></div>

            </div>


        </div>


    </div>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav class="nav">


        <a
            href="#"
            style="opacity:.3;pointer-events:none">

            ← Back

        </a>


        <div class="dots">

            <i class="active"></i>

            <i></i>

            <i></i>

            <i></i>

            <i></i>

            <i></i>

            <i></i>

            <i></i>

        </div>


        <a href="page2.html">

            Next →

        </a>


    </nav>


</section>


</main>


<!-- =========================================================
     LEFT BALLOONS
========================================================= -->

<div class="balloons left">

    <span class="balloon purple"></span>

    <span class="balloon pink"></span>

</div>


<!-- =========================================================
     RIGHT BALLOONS
========================================================= -->

<div class="balloons right">

    <span class="balloon blue"></span>

    <span class="balloon pink"></span>

</div>


<!-- =========================================================
     BOTTOM BALLOONS
========================================================= -->

<div class="bottom">

    <span class="balloon blue"></span>

    <span class="balloon yellow"></span>

    <span class="balloon pink"></span>

</div>


<!-- =========================================================
     MUSIC
========================================================= -->

<audio
    id="music"
    loop>

    <source
        src="music/birthday.mp3"
        type="audio/mpeg">

</audio>


<!-- =========================================================
     EXISTING JAVASCRIPT
========================================================= -->

<script src="js/script.js"></script>


<!-- =========================================================
     PAGE 1 TEXT ANIMATION
========================================================= -->

<script>

/* =========================================================
   MESSAGE
========================================================= */

const birthdayMessage =
    "Hey my love... today isn't just another birthday. It's the day the most beautiful part of my life came into this world.";


/* =========================================================
   WORDS THAT SHOULD GLOW PINK
========================================================= */

const highlightedWords = [

    "love",

    "beautiful",

    "life"

];


/* =========================================================
   FIND SUBTITLE
========================================================= */

const subtitle =
    document.getElementById(
        "birthdaySubtitle"
    );


/* =========================================================
   CHECK IF WORD SHOULD BE HIGHLIGHTED
========================================================= */

function shouldHighlight(word) {

    const cleanWord =
        word
            .toLowerCase()
            .replace(
                /[^a-zA-ZÀ-ÿ'-]/g,
                ""
            );

    return highlightedWords.includes(
        cleanWord
    );
}


/* =========================================================
   ANIMATE MESSAGE
========================================================= */

function animateBirthdayMessage() {

    /*
       Clear existing text
    */

    subtitle.innerHTML = "";


    /*
       Split message into words
    */

    const words =
        birthdayMessage.split(" ");


    /*
       Delay between words

       100 = fast
       130 = normal
       160 = romantic
       200 = slow
    */

    const wordDelay = 140;


    /*
       Create each word
    */

    words.forEach(
        (word, index) => {

            const span =
                document.createElement(
                    "span"
                );


            span.classList.add(
                "animated-word"
            );


            span.textContent =
                word;


            /*
               Highlight romantic words
            */

            if (
                shouldHighlight(word)
            ) {

                span.classList.add(
                    "highlight"
                );

            }


            /*
               Each word appears
               after the previous one
            */

            span.style.animationDelay =
                `${index * wordDelay}ms`;


            subtitle.appendChild(
                span
            );


            /*
               Add space
            */

            subtitle.appendChild(
                document.createTextNode(" ")
            );

        }
    );


    /*
       Add final heart after
       all words
    */

    const heart =
        document.createElement(
            "span"
        );


    heart.classList.add(
        "animated-heart"
    );


    heart.textContent =
        "♥";


    heart.style.animationDelay =
        `${words.length * wordDelay}ms, ${words.length * wordDelay + 600}ms`;


    subtitle.appendChild(
        heart
    );

}


/* =========================================================
   START ANIMATION
========================================================= */

window.addEventListener(
    "load",
    () => {

        /*
           Small delay before
           animation begins.
        */

        setTimeout(
            () => {

                animateBirthdayMessage();

            },
            600
        );

    }
);

</script>


</body>

</html>
