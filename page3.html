<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Things I Love About You ❤️</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page-bg"></div>

<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<header class="topbar">

    <div class="brand">
        <span class="brand-heart">♥</span>
        <span>Happy Birthday</span>
    </div>

    <button class="music-btn" id="musicBtn">
        <span id="musicIcon">♫</span>
    </button>

</header>

<main class="main">

<section class="card">

    <div class="page-no">3 / 8</div>

    <div class="center">

        <div class="content">

            <span class="heart">♥</span>

            <h2 class="small-title">
                Little Things I Love About You
            </h2>

            <div class="grid">

                <div class="box">
                    <span class="icon">✨</span>
                    <span>Your beautiful smile</span>
                </div>

                <div class="box">
                    <span class="icon">🌸</span>
                    <span>The way you care</span>
                </div>

                <div class="box">
                    <span class="icon">💫</span>
                    <span>Your amazing energy</span>
                </div>

                <div class="box">
                    <span class="icon">🥰</span>
                    <span>Your cute little moments</span>
                </div>

                <div class="box">
                    <span class="icon">🌙</span>
                    <span>The peace you bring</span>
                </div>

                <div class="box">
                    <span class="icon">❤️</span>
                    <span>Simply being you</span>
                </div>

            </div>

        </div>

    </div>

    <nav class="nav">

        <a href="page2.html">
            ← Back
        </a>

        <div class="dots">
            <i></i>
            <i></i>
            <i class="active"></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
        </div>

        <a href="page4.html">
            Next →
        </a>

    </nav>

</section>

</main>

<div class="balloons left">
    <span class="balloon purple"></span>
    <span class="balloon pink"></span>
</div>

<div class="balloons right">
    <span class="balloon blue"></span>
    <span class="balloon pink"></span>
</div>

<div class="bottom">
    <span class="balloon blue"></span>
    <span class="balloon yellow"></span>
    <span class="balloon pink"></span>
</div>

<audio id="music" loop>
    <source src="music/birthday.mp3" type="audio/mpeg">
</audio>

<script src="js/script.js"></script>

</body>
</html>
