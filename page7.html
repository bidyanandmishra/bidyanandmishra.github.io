<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Wishes ❤️</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page-bg"></div>

<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<header class="topbar">

    <div class="brand">
        <span class="brand-heart">♥</span>
        <span>Happy Birthday</span>
    </div>

    <button class="music-btn" id="musicBtn">
        <span id="musicIcon">♫</span>
    </button>

</header>

<main class="main">

<section class="card">

    <div class="center">

        <div class="content">

            <span class="heart">♥</span>

            <h2 class="small-title">
                My Birthday Wishes For You 🎂
            </h2>

            <div class="wishes">

                <span class="wish">
                    Lots of happiness ❤️
                </span>

                <span class="wish">
                    Endless smiles 😊
                </span>

                <span class="wish">
                    Beautiful memories ✨
                </span>

                <span class="wish">
                    Success in everything 🌟
                </span>

                <span class="wish">
                    Good health 🌸
                </span>

                <span class="wish">
                    Love and laughter 💕
                </span>

                <span class="wish">
                    Dreams coming true 🌙
                </span>

                <span class="wish">
                    A wonderful year ahead 🎉
                </span>

            </div>

            <p class="message">
                May every new day bring you
                one more reason to smile.
            </p>

        </div>

    </div>

    <nav class="nav">

        <a href="page6.html">
            ← Back
        </a>

        <div class="dots">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i class="active"></i>
            <i></i>
        </div>

        <a href="page8.html">
            Next →
        </a>

    </nav>

</section>

</main>

<div class="balloons left">
    <span class="balloon purple"></span>
    <span class="balloon pink"></span>
</div>

<div class="balloons right">
    <span class="balloon blue"></span>
    <span class="balloon pink"></span>
</div>

<div class="bottom">
    <span class="balloon blue"></span>
    <span class="balloon yellow"></span>
    <span class="balloon pink"></span>
</div>

<audio id="music" loop>
    <source src="music/birthday.mp3" type="audio/mpeg">
</audio>

<script src="js/script.js"></script>

</body>
</html>
