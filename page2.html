<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Something For You ❤️</title>

    <link rel="stylesheet" href="css/page2.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">
        <div class="birthday-title">
            <span class="header-heart">♥</span>
            Happy Birthday
        </div>
    </header>


    <!-- ================= BACKGROUND ================= -->

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <!-- ================= BALLOONS ================= -->

    <div class="balloon balloon-purple balloon-left-top">
        <div class="balloon-body"></div>
        <div class="balloon-string"></div>
    </div>

    <div class="balloon balloon-pink balloon-left-bottom">
        <div class="balloon-body"></div>
        <div class="balloon-string"></div>
    </div>

    <div class="balloon balloon-blue balloon-right-top">
        <div class="balloon-body"></div>
        <div class="balloon-string"></div>
    </div>

    <div class="balloon balloon-pink balloon-right-bottom">
        <div class="balloon-body"></div>
        <div class="balloon-string"></div>
    </div>


    <!-- ================= FLOATING HEARTS ================= -->

    <div class="floating-heart heart-1">♡</div>
    <div class="floating-heart heart-2">♥</div>
    <div class="floating-heart heart-3">♡</div>
    <div class="floating-heart heart-4">♥</div>
    <div class="floating-heart heart-5">♡</div>
    <div class="floating-heart heart-6">♥</div>


    <!-- ================= MAIN CARD ================= -->

    <main class="main-card">

        <!-- Page number -->

        <div class="page-number">
            2 / 9
        </div>


        <!-- Heading -->

        <div class="heading-area">

            <div class="heading-heart">
                ♥
            </div>

            <h1>
                A Little Something For You
                <span>💕</span>
            </h1>

            <div class="heading-decoration">
                <span></span>
                <b>♡</b>
                <span></span>
            </div>

        </div>


        <!-- ================= MESSAGE BOX ================= -->

        <section class="message-box">

            <!-- Decorative left icon -->

            <div class="message-decoration">

                <div>♧</div>
                <div>✦</div>
                <div>♡</div>
                <div>✿</div>
                <div>☆</div>
                <div>⌂</div>
                <div>♡</div>
                <div>☏</div>
                <div>✧</div>
                <div>▣</div>
                <div>▧</div>
                <div>♥</div>
                <div>♧</div>
                <div>◉</div>
                <div>♥</div>

            </div>


            <!-- Text -->

            <div class="message-content">

                <div id="messageText"></div>

                <span id="cursor" class="cursor"></span>

            </div>


            <!-- Decorative bottom -->

            <div class="message-bottom-decoration">

                <span>♡</span>

                <div class="curved-line"></div>

                <span>♡</span>

            </div>

        </section>


        <!-- ================= NAVIGATION ================= -->

        <div class="navigation">

            <button
                class="nav-button"
                onclick="previousPage()">

                ← Back

            </button>


            <!-- Pagination -->

            <div class="pagination">

                <span></span>

                <span class="active"></span>

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <button
                class="nav-button"
                onclick="nextPage()">

                Next →

            </button>

        </div>

    </main>


    <script src="js/page2.js"></script>

</body>
</html>
