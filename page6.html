<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Another Favorite Moment ❤️</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page-bg"></div>

<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<header class="topbar">

    <div class="brand">
        <span class="brand-heart">♥</span>
        <span>Happy Birthday</span>
    </div>

    <button class="music-btn" id="musicBtn">
        <span id="musicIcon">♫</span>
    </button>

</header>

<main class="main">

<section class="card">

    <div class="page-no">6 / 8</div>

    <div class="center">

        <div class="content">

            <span class="heart">♥</span>

            <h2 class="small-title">
                Another Favorite Moment 🥰
            </h2>

            <div class="photo">

                <img
                    src="images/photo2.jpg"
                    alt="Favorite memory">

            </div>

            <p class="message">
                I want to grow old with you, laugh with you, travel with you, annoy you, and still hold your hand through everything. ❤️
            </p>

        </div>

    </div>

    <nav class="nav">

        <a href="page5.html">
            ← Back
        </a>

        <div class="dots">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i class="active"></i>
            <i></i>
            <i></i>
        </div>

        <a href="page7.html">
            Next →
        </a>

    </nav>

</section>

</main>

<div class="balloons left">
    <span class="balloon purple"></span>
    <span class="balloon pink"></span>
</div>

<div class="balloons right">
    <span class="balloon blue"></span>
    <span class="balloon pink"></span>
</div>

<div class="bottom">
    <span class="balloon blue"></span>
    <span class="balloon yellow"></span>
    <span class="balloon pink"></span>
</div>

<audio id="music" loop>
    <source src="music/birthday.mp3" type="audio/mpeg">
</audio>

<script src="js/script.js"></script>

</body>
</html>
